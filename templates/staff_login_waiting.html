<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiting for approval</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 36px 32px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    color: #e2e8f0;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,.15);
    border-top-color: #f97316;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; color: #94a3b8; margin: 0 0 20px; }
  .status { font-weight: 700; }
  .status.denied, .status.expired { color: #f87171; }
  .status.approved { color: #4ade80; }
  a.retry {
    display: inline-block;
    margin-top: 12px;
    color: #f97316;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="spinner"></div>
    <h1 id="title">Waiting for Admin approval&hellip;</h1>
    <p id="subtitle">A new device was detected. Please wait while the Admin approves this login.</p>
    <div id="statusLine" class="status"></div>
    <a href="{% url 'staff_login' %}" class="retry" id="retryLink" style="display:none;">Back to login</a>
  </div>

<script>
(function () {
  var token = "{{ token }}";
  var pollUrl = "/staff/login/poll/" + token + "/";
  var titleEl = document.getElementById("title");
  var subtitleEl = document.getElementById("subtitle");
  var spinnerEl = document.getElementById("spinner");
  var statusEl = document.getElementById("statusLine");
  var retryEl = document.getElementById("retryLink");

  function stop(status, message) {
    spinnerEl.style.display = "none";
    titleEl.textContent = message;
    statusEl.textContent = "";
    statusEl.className = "status " + status;
    retryEl.style.display = "inline-block";
  }

  function tick() {
    fetch(pollUrl, { credentials: "same-origin", cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.status === "approved" && data.redirect) {
          titleEl.textContent = "Approved! Redirecting…";
          window.location = data.redirect;
          return;
        }
        if (data.status === "denied") {
          stop("denied", "Login denied by Admin.");
          return;
        }
        if (data.status === "expired") {
          stop("expired", "Request expired. Please log in again.");
          return;
        }
        if (data.status === "not_found" || data.status === "forbidden") {
          stop("expired", "This request is no longer valid.");
          return;
        }
        setTimeout(tick, 2500);
      })
      .catch(function () {
        setTimeout(tick, 4000);
      });
  }

  setTimeout(tick, 1500);
})();
</script>
</body>
</html>
